<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Admin Dashboard</title>
        <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

        <!-- Stylesheets -->
        <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

        <!-- JavaScript Components (shared utilities) -->
        <script th:src="@{/js/util.js}" defer></script>
        <script th:src="@{/js/render.js}" defer></script>
        <script type="module" th:src="@{/js/components/header.js}" defer></script>
        <script type="module" th:src="@{/js/components/footer.js}" defer></script>
    </head>

    <body onload="renderContent()">

        <!-- Page Container -->
        <div class="container">
            <div class="wrapper">

                <!-- Header Placeholder -->
                <div id="header"></div>

                <!-- Main Section -->
                <main class="main-content">
                    <h1>Admin Dashboard</h1>

                    <!-- Search Bar -->
                    <input type="text" id="searchBar" placeholder="Search Doctors by Name..." class="search-input" />

                    <!-- Filter Dropdowns -->
                    <div class="filters">
                        <select id="filterTime">
                            <option value="">Filter by Time</option>
                            <option value="AM">AM</option>
                            <option value="PM">PM</option>
                        </select>

                        <select id="filterSpecialty">
                            <option value="">Filter by Specialty</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Dentist">Dentist</option>
                            <option value="Dermatologist">Dermatologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="General">General</option>
                        </select>

                        <!-- Add Doctor Button -->
                        <button id="addDoctorBtn" class="dashboard-btn">Add Doctor</button>
                    </div>

                    <!-- Doctor Card Container -->
                    <div id="content" class="doctor-card-list"></div>
                </main>

                <!-- Footer Placeholder -->
                <div id="footer"></div>
            </div>
        </div>

        <!-- Modal Popup for Add Doctor -->
        <div id="modal" class="modal-overlay hidden">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <div id="modal-body">
                    <!-- Doctor Form injected dynamically -->
                </div>
            </div>
        </div>

        <!-- Page-Specific Scripts -->
        <script type="module" src="../js/services/adminDashboard.js" defer></script>
        <script type="module" src="../js/components/doctorCard.js" defer></script>
    </body>

</html>
